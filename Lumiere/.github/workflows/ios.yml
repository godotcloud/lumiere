name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Lumiere.xcodeproj
  SCHEME: Lumiere
  APP_NAME: Lumiere.app

jobs:
  build:
    name: 编译与打包
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # macos-15 自带多个 Xcode 版本，固定选最新稳定版，避免默认版本低于工程要求（Xcode 16）
      - name: 选择 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 环境信息
        run: |
          xcodebuild -version
          xcodebuild -list -project "$PROJECT"

      # 模拟器编译：不需要证书，用来验证代码能否通过编译。
      # 这是 PR 上最该跑的检查——相当于一次全量类型检查。
      - name: 编译（iOS 模拟器）
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -resultBundlePath build/Simulator.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: 打包模拟器 App
        if: success()
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent "$APP_NAME" "$GITHUB_WORKSPACE/Lumiere-simulator.zip"

      # 未签名 IPA：真机架构编译产物，装进 Payload/ 打成 ipa。
      # 它不能直接安装，需要用 Sideloadly / AltStore 重新签名后侧载。
      - name: 打包未签名 IPA
        if: success()
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-ipa \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

          mkdir -p Payload
          cp -R "build-ipa/Build/Products/Release-iphoneos/$APP_NAME" Payload/
          zip -qry Lumiere-unsigned.ipa Payload
          ls -lh Lumiere-unsigned.ipa

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lumiere-build
          path: |
            Lumiere-simulator.zip
            Lumiere-unsigned.ipa
          retention-days: 14

      # 编译失败时上传诊断日志，比在网页里翻几千行 xcodebuild 输出快得多
      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Lumiere-failure-logs
          path: build/Simulator.xcresult
          retention-days: 7
          if-no-files-found: ignore
